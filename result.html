<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Exam Result | KEYRADDIIN EXAM CENTER</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/result.css">

</head>


<body>

<header class="site-header">

    <div class="container header-content">

        <a href="index.html" class="brand">

            <span class="brand-icon">
                🎓
            </span>

            <span class="brand-text">

                <strong>
                    KEYRADDIIN EXAM CENTER
                </strong>

                <small>
                    SECOND BRANCH
                </small>

            </span>

        </a>


        <a href="profile.html" class="profile-link">
            MY PROFILE
        </a>

    </div>

</header>


<main class="result-page">

    <div class="container">

        <section class="result-card">

            <div class="result-header">

                <div
                    id="statusIcon"
                    class="result-status-icon"
                >
                    🏆
                </div>

                <span>
                    EXAM COMPLETED
                </span>

                <h1>
                    Your Examination Result
                </h1>

                <p id="resultStudent">
                    Student
                </p>

            </div>


            <div
                id="statusBadge"
                class="status-badge"
            >
                PASS
            </div>


            <div class="score-main">

                <span>
                    SCORE
                </span>

                <strong id="percentage">
                    0%
                </strong>

                <small id="scoreText">
                    0 / 0
                </small>

            </div>


            <div class="result-grid">

                <div class="result-item">

                    <span>
                        CORRECT
                    </span>

                    <strong id="correct">
                        0
                    </strong>

                </div>


                <div class="result-item">

                    <span>
                        WRONG
                    </span>

                    <strong id="wrong">
                        0
                    </strong>

                </div>


                <div class="result-item">

                    <span>
                        TIME USED
                    </span>

                    <strong id="timeUsed">
                        00:00
                    </strong>

                </div>


                <div class="result-item">

                    <span>
                        EXAM CODE
                    </span>

                    <strong id="examCode">
                        -
                    </strong>

                </div>

            </div>


            <div class="result-details">

                <div>
                    <span>Subject</span>
                    <strong id="subject">-</strong>
                </div>

                <div>
                    <span>Unit</span>
                    <strong id="unit">-</strong>
                </div>

                <div>
                    <span>Grade</span>
                    <strong id="grade">-</strong>
                </div>

            </div>


            <!-- =================================================
                 RESULT ACTIONS
                 ================================================= -->

            <div class="result-actions">

                <a
                    href="ranking.html"
                    class="btn btn-primary"
                >
                    🏆 VIEW RANKING
                </a>


                <a
                    href="certificate.html"
                    id="certificateBtn"
                    class="btn btn-secondary"
                >
                    🎓 CERTIFICATE
                </a>


                <a
                    href="profile.html"
                    class="btn btn-primary"
                >
                    👤 MY PROFILE
                </a>


                <a
                    href="index.html"
                    class="btn result-home-btn"
                >
                    🏠 HOME
                </a>

            </div>

        </section>

    </div>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            © 2026 KEYRADDIIN EXAM CENTER SECOND BRANCH
        </p>

    </div>

</footer>


<script src="js/result.js"></script>

</body>
</html>
